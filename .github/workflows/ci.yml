name: 🚀 Build ZoroBeamShare APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ── Build Android APK ─────────────────────────────────────────────────────
  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZoroBeamShare-debug.apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "ZoroBeamShare v1.0.0"
          body: |
            ### 🌊 ZoroBeamShare v1.0.0 (Release Build)

            Download the standalone installable Android APK directly below:
            - **[Download ZoroBeamShare APK](https://github.com/THEZORTHIX/ZoroBeamShare/releases/download/v1.0.0/app-debug.apk)**

            ---
            #### 🌟 Highlights & Capabilities:
            - 🫧 **Translucent Liquid Glass UI**: Frosted glass card containers with ambient light gradient orbs.
            - ⚡ **High-Speed P2P Transfers**: Direct LAN TCP socket chunked 64KB data stream (speeds exceeding 30-80MB/s on Wi-Fi 5/6).
            - 📡 **Automatic Peer Discovery**: Fast UDP multicast beacon on port 45399.
            - 📱 **QR Code Direct Handshake**: Zero configuration pairing by scanning peer QR code.
            - 📋 **Universal Content Sharing**: Seamless transfer for files, folders, multi-selection, and clipboard text.
            - 🛡️ **Zero Cloud / Complete Privacy**: 100% peer-to-peer on local hardware with background foreground service.
          files: android/app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
